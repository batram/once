<div id="sep_slider"></div>
<section id="right_panel">
  <div id="tab_dropzone" class="bar">
    <div id="electron_tabs" role="tablist" aria-label="Browser tabs"></div>
    <button type="button" id="new_tab_btn" class="legacy-tab-button" title="New tab" aria-label="New tab">+</button>
  </div>
  <div id="controlbar" class="bar">
    <button type="button" id="browser_back" class="browser-button image-button" title="Back" aria-label="Back">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" /></svg>
    </button>
    <button type="button" id="browser_forward" class="browser-button image-button" title="Forward" aria-label="Forward">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
    </button>
    <button type="button" id="browser_reload" class="browser-button image-button" title="Reload" aria-label="Reload">
      <span class="icon icon--chrome icon--reload" aria-hidden="true"></span>
    </button>
    <input id="urlfield" type="text" spellcheck="false" aria-label="Address" aria-describedby="url_error" placeholder="type URL here" />
    <button type="button" id="blocked_popups" aria-haspopup="menu" aria-live="polite" hidden>Popup blocked</button>
    <div id="extension_actions" role="toolbar" aria-label="Browser Extensions"></div>
    <button type="button" id="browser_reader" class="browser-button image-button" title="Reader mode" aria-label="Reader mode">
      <span class="icon icon--chrome icon--article" aria-hidden="true"></span>
    </button>
    <button type="button" id="browser_close" class="browser-button image-button" title="Close tab" aria-label="Close tab">
      <span class="icon icon--chrome icon--x" aria-hidden="true"></span>
    </button>
  </div>
  <div id="url_error" role="alert" aria-live="polite"></div>
  <div id="tab_content"></div>
  <div id="find_bar" class="bar" role="search" aria-label="Find in page" hidden>
    <input id="find_field" type="text" spellcheck="false" placeholder="Find in page" aria-label="Find in page" aria-describedby="find_count" />
    <span id="find_count" aria-live="polite"></span>
    <button type="button" id="find_prev" class="browser-button image-button" title="Previous match (Shift+Enter)" aria-label="Previous match">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6" /></svg>
    </button>
    <button type="button" id="find_next" class="browser-button image-button" title="Next match (Enter)" aria-label="Next match">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
    </button>
    <button type="button" id="find_close" class="browser-button image-button" title="Close find bar (Escape)" aria-label="Close find bar">
      <span class="icon icon--chrome icon--x" aria-hidden="true"></span>
    </button>
  </div>
</section>
