<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; connect-src 'none'">
    <title>Extensions</title>
  </head>
  <body role="dialog" aria-labelledby="extensions-title">
    <header><h1 id="extensions-title">Extensions</h1><button type="button" id="close" class="icon-button" aria-label="Close extensions" title="Close extensions">×</button></header>
    <main id="extensions" aria-label="Installed extensions"></main>
    <p id="error" role="alert" hidden></p>
    <footer><button type="button" id="settings"><span aria-hidden="true">⚙</span>Manage extensions</button></footer>
  </body>
</html>
