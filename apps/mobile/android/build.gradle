// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    // Every project declares the versions itself: the Capacitor plugins' own
    // project.hasProperty(...) checks would otherwise resolve them from the
    // root project, an implicit lookup Gradle 10 turns into an error.
    apply from: rootProject.file('variables.gradle')
    repositories {
        google()
        mavenCentral()
        // GeckoView is published by Mozilla, not on Maven Central.
        maven { url = "https://maven.mozilla.org/maven2/" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
