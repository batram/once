apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

def rootPackage = new JsonSlurper().parseText(
    new File(rootProject.projectDir, '../../../package.json').text
)
def onceBuildNumber = Integer.parseInt(System.getenv('ONCE_BUILD_NUMBER') ?: '1')
// Only local deployment passes this property. Normal APK/AAB builds keep both ABIs.
def onceDeployAbis = providers.gradleProperty('onceDeployAbis').orElse('arm64-v8a,x86_64').get().split(',')
if (!onceDeployAbis.every { it in ['arm64-v8a', 'x86_64'] }) {
    throw new GradleException('onceDeployAbis must contain only arm64-v8a or x86_64')
}

android {
    namespace = "com.zmarn.once"
    compileSdk = rootProject.ext.compileSdkVersion
    compileSdkMinor = rootProject.ext.compileSdkMinorVersion
    defaultConfig {
        applicationId "com.zmarn.once"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode onceBuildNumber
        versionName rootPackage.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        // GeckoView ships native code per ABI; devices and the emulator cover these two.
        ndk {
            abiFilters.addAll(onceDeployAbis)
        }
    }
    // The flavours stamp app_name; AGP 9 no longer generates resValues unless asked.
    buildFeatures {
        resValues = true
    }
    flavorDimensions += "environment"
    productFlavors {
        development {
            dimension "environment"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            resValue "string", "app_name", "Once Dev"
            resValue "string", "title_activity_main", "Once Dev"
        }
        production {
            dimension "environment"
            resValue "string", "app_name", "Once"
            resValue "string", "title_activity_main", "Once"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// The built-in extensions GeckoView loads from resource://android/assets/<name>/
// (see GeckoEngine): Once's own bridge, and the bundles scripts/fetch-extensions.js
// unpacks into vendor/extensions. Violentmonkey comes from android/, the copy
// carrying the app's userscript relay; the upstream, iOS and uBO Lite bundles
// stay out. AGP ignores source-set excludes for assets, so the wanted bundles
// are copied into a generated asset dir instead.
abstract class OnceExtensionAssets extends DefaultTask {
    @InputDirectory @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getOnceExtensions()
    @InputDirectory @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getVendorExtensions()
    @OutputDirectory
    abstract DirectoryProperty getOutputDir()
    @Inject
    abstract FileSystemOperations getFs()

    @TaskAction
    void sync() {
        fs.sync { spec ->
            spec.into(outputDir)
            spec.from(onceExtensions)
            spec.from(vendorExtensions) { it.include('ublock-origin/**', 'android/violentmonkey/**') }
        }
    }
}

def onceExtensionAssets = tasks.register('onceExtensionAssets', OnceExtensionAssets) {
    onceExtensions = file('../../extensions')
    vendorExtensions = file('../../../../vendor/extensions')
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets?.addGeneratedSourceDirectory(onceExtensionAssets, { it.outputDir })
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:$androidxSwipeRefreshLayoutVersion"
    implementation project(':capacitor-android')
    implementation "org.mozilla.geckoview:geckoview:$geckoViewVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
