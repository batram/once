apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

def rootPackage = new JsonSlurper().parseText(
    new File(rootProject.projectDir, '../../../package.json').text
)
def onceBuildNumber = Integer.parseInt(System.getenv('ONCE_BUILD_NUMBER') ?: '1')
// Only local deployment passes this property. Normal APK/AAB builds keep both ABIs.
def onceDeployAbis = providers.gradleProperty('onceDeployAbis').orElse('arm64-v8a,x86_64').get().split(',')
if (!onceDeployAbis.every { it in ['arm64-v8a', 'x86_64'] }) {
    throw new GradleException('onceDeployAbis must contain only arm64-v8a or x86_64')
}

android {
    namespace = "com.zmarn.once"
    compileSdk = rootProject.ext.compileSdkVersion
    compileSdkMinor = rootProject.ext.compileSdkMinorVersion
    defaultConfig {
        applicationId "com.zmarn.once"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode onceBuildNumber
        versionName rootPackage.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        // GeckoView ships native code per ABI; devices and the emulator cover
        // these two. Once Lite has no native code, so the filter is moot there.
        ndk {
            abiFilters.addAll(onceDeployAbis)
        }
    }
    // The flavours stamp app_name; AGP 9 no longer generates resValues unless asked.
    buildFeatures {
        resValues = true
    }
    // minSdk 26 makes AGP deflate the dex. An install that ART has not compiled
    // yet (adb, cap run, Android Studio) then inflates its own ~35-40 MB copy
    // in every app process, Gecko's helpers included; stored dex is mapped
    // straight from the APK and shared. The APK grows by about 25 MB.
    packaging {
        dex {
            useLegacyPackaging = false
        }
    }
    // engine: the browsing surface (GeckoView, or Once Lite's system WebView);
    // environment: dev or production identity. Variant ids are
    // com.zmarn.once[.lite][.dev]; engine comes first in task names
    // (assembleGeckoDevelopmentDebug, bundleLiteProductionRelease).
    flavorDimensions += ["engine", "environment"]
    productFlavors {
        gecko {
            dimension "engine"
        }
        lite {
            dimension "engine"
            applicationIdSuffix ".lite"
        }
        development {
            dimension "environment"
            // Isolated durability qualification must never reuse a configured dev or release profile.
            applicationIdSuffix providers.gradleProperty('onceNativeStorageProbe').isPresent() ? ".nativeprobe" : ".dev"
            versionNameSuffix "-dev"
        }
        production {
            dimension "environment"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// The built-in extensions GeckoView loads from resource://android/assets/<name>/
// (see GeckoEngine): Once's own bridge, and the bundles scripts/fetch-extensions.js
// unpacks into vendor/extensions. Android copies carry the userscript relay
// and uBlock startup adaptation; the upstream, iOS and uBO Lite bundles
// stay out. AGP ignores source-set excludes for assets, so the wanted bundles
// are copied into a generated asset dir instead.
abstract class OnceExtensionAssets extends DefaultTask {
    @InputDirectory @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getOnceExtensions()
    @InputDirectory @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getVendorExtensions()
    @OutputDirectory
    abstract DirectoryProperty getOutputDir()
    @Inject
    abstract FileSystemOperations getFs()

    @TaskAction
    void sync() {
        fs.sync { spec ->
            spec.into(outputDir)
            spec.from(onceExtensions)
            spec.from(vendorExtensions) { it.include('android/ublock-origin/**', 'android/violentmonkey/**') }
        }
    }
}

def onceExtensionAssets = tasks.register('onceExtensionAssets', OnceExtensionAssets) {
    onceExtensions = file('../../extensions')
    vendorExtensions = file('../../../../vendor/extensions')
}

// Once Lite's runtime loads the plain upstream bundles (no Gecko relay) from
// assets/extensions/<dir>/; LiteFiles resolves `asset:extensions/<dir>`.
abstract class OnceLiteExtensionAssets extends DefaultTask {
    @InputDirectory @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getVendorExtensions()
    @InputFile @PathSensitive(PathSensitivity.RELATIVE)
    abstract RegularFileProperty getModulePreloadScript()
    @InputFiles @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getModuleBuildInputs()
    @Inject
    abstract ExecOperations getExecOps()
    @OutputDirectory
    abstract DirectoryProperty getOutputDir()
    @Inject
    abstract FileSystemOperations getFs()

    @TaskAction
    void sync() {
        fs.sync { spec ->
            spec.into(outputDir)
            spec.from(vendorExtensions) {
                it.into('extensions')
                it.include('ublock-origin/**', 'violentmonkey/**')
                // Tier 2 (no DevTools) enforces uBlock Origin Lite's default
                // rulesets and generic cosmetics itself (LiteTier2); only those
                // files ship. Keep the list in step with the manifest's
                // enabled rule_resources when the bundle is updated.
                it.include('ublock-origin-lite/manifest.json', 'ublock-origin-lite/LICENSE.txt',
                    'ublock-origin-lite/_locales/**', 'ublock-origin-lite/img/icon_*.png',
                    'ublock-origin-lite/web_accessible_resources/**',
                    'ublock-origin-lite/js/scripting/isolated-api.js', 'ublock-origin-lite/js/scripting/css-generic.js')
                for (String ruleset : ['ublock-filters', 'easylist', 'easyprivacy']) {
                    it.include("ublock-origin-lite/rulesets/main/${ruleset}.json", "ublock-origin-lite/rulesets/regex/${ruleset}.json",
                        "ublock-origin-lite/rulesets/scripting/generic/${ruleset}.js")
                }
            }
        }
        execOps.exec {
            commandLine 'node', modulePreloadScript.get().asFile.absolutePath,
                new File(outputDir.get().asFile, 'extensions/ublock-origin').absolutePath
        }
    }
}

def onceLiteExtensionAssets = tasks.register('onceLiteExtensionAssets', OnceLiteExtensionAssets) {
    vendorExtensions = file('../../../../vendor/extensions')
    modulePreloadScript = file('../../../../scripts/prepare-lite-extension-modules.js')
    moduleBuildInputs.from(file('../../../../scripts/bundle-lite-extension-modules.js'), file('../../../../package-lock.json'))
}

androidComponents {
    // app_name per variant: the environment flavour alone cannot see the engine.
    onVariants(selector().all()) { variant ->
        boolean lite = variant.flavorName.startsWith("lite")
        boolean dev = variant.flavorName.endsWith("Development")
        String name = (lite ? "Once Lite" : "Once") + (dev ? " Dev" : "")
        for (String key : ["app_name", "title_activity_main"]) {
            variant.resValues.put(variant.makeResValueKey("string", key), new com.android.build.api.variant.ResValue(name, null))
        }
    }
    // Each engine carries its own copies of the bundled extensions: GeckoView
    // the adapted ones, Once Lite's runtime (docs/plans/once-lite-plan.md) the
    // upstream bundles.
    onVariants(selector().withFlavor("engine", "gecko")) { variant ->
        variant.sources.assets?.addGeneratedSourceDirectory(onceExtensionAssets, { it.outputDir })
    }
    onVariants(selector().withFlavor("engine", "lite")) { variant ->
        variant.sources.assets?.addGeneratedSourceDirectory(onceLiteExtensionAssets, { it.outputDir })
    }
}

// variables.gradle tracks the newest GeckoView release by hand. Every gecko
// build asks Mozilla's Maven for the current one and warns when the pin trails
// it; no network (or -PonceSkipGeckoViewCheck, or --offline) keeps quiet.
def checkGeckoViewVersion = tasks.register('checkGeckoViewVersion') {
    group = 'verification'
    description = "Warns when geckoViewVersion is behind the newest GeckoView release"
    def pinned = rootProject.ext.geckoViewVersion
    def metadata = 'https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/maven-metadata.xml'
    def skip = providers.gradleProperty('onceSkipGeckoViewCheck').isPresent() || gradle.startParameter.offline
    outputs.upToDateWhen { false }
    onlyIf { !skip }
    doLast {
        String latest
        try {
            def connection = new URL(metadata).openConnection()
            connection.connectTimeout = 5000
            connection.readTimeout = 5000
            def xml = new groovy.xml.XmlSlurper().parse(connection.inputStream)
            latest = xml.versioning.latest.text()
        } catch (Exception e) {
            logger.lifecycle("GeckoView: could not read the release list ($e.message); pinned $pinned")
            return
        }
        if (!latest) {
            logger.warn("GeckoView: release list at $metadata names no latest version; pinned $pinned")
        } else if (latest != pinned) {
            logger.warn("WARNING: GeckoView $pinned is pinned in variables.gradle but $latest is the newest release; bump geckoViewVersion")
        } else {
            logger.lifecycle("GeckoView $pinned is the newest release")
        }
    }
}
tasks.configureEach { task ->
    if (task.name ==~ /preGecko\w+Build/) task.dependsOn(checkGeckoViewVersion)
}

dependencies {
    implementation "androidx.sqlite:sqlite-bundled:2.6.2"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:$androidxSwipeRefreshLayoutVersion"
    // Capacitor's own version; the shell renderer recovery injects its bridge script.
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    // Firefox's engine, in the gecko variants only; Once Lite is the system WebView.
    liteImplementation "com.google.re2j:re2j:1.8"
    geckoImplementation "org.mozilla.geckoview:geckoview:$geckoViewVersion"
    implementation "androidx.exifinterface:exifinterface:$androidxExifInterfaceVersion"
    // Bundled Latin model: on-device, no Play services or model download.
    implementation "com.google.mlkit:text-recognition:$mlkitTextRecognitionVersion"
    testImplementation "junit:junit:$junitVersion"
    // The real org.json for JVM tests of code that uses Android's copy (ShallowJson).
    testImplementation "org.json:json:20250517"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
