name: Mobile tests

# Mobile runners are intentionally opt-in.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-android:
    name: Capacitor Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:mobile
      - run: npm run test:mobile:web
      - run: npm run mobile -- package android --channel dev --e2e
      - name: Android native lint and unit tests
        working-directory: apps/mobile/android
        run: java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain lintDevelopmentDebug testDevelopmentDebugUnitTest --no-daemon
      - run: npm exec --workspace @once/mobile -- appium driver install uiautomator2@8.1.0
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          script: npm run test:mobile:e2e:android
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobile-android-${{ github.run_id }}
          path: |
            apps/mobile/android/app/build/outputs/apk/development/debug/*.apk
            apps/mobile/android/app/build/reports
            test-results/mobile
          if-no-files-found: warn

  mobile-ios:
    name: Capacitor iOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run mobile -- package ios --channel dev --e2e
      - run: npm exec --workspace @once/mobile -- appium driver install xcuitest@11.17.7
      # Boot the simulator ourselves and block until it is fully up. Appium's
      # internal boot monitor gives up after a hard 121s, which the runner's
      # first cold boot ("Waiting on BackBoard") overruns; simctl bootstatus -b
      # has no such cap. Pin a specific UDID so Appium attaches to the exact
      # device we booted (the runner has an "iPhone 17 Pro" per iOS runtime).
      - name: Boot iOS simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devices in runtimes.items():
              if "iOS" not in runtime:
                  continue
              version = runtime.rsplit("iOS-", 1)[-1].split("-")
              key = tuple(int(part) for part in version if part.isdigit())
              for device in devices:
                  if device.get("name") == "iPhone 17 Pro" and device.get("isAvailable"):
                      if best is None or key > best[0]:
                          best = (key, device["udid"])
          print(best[1] if best else "")
          ')
          if [ -z "$UDID" ]; then echo "No available iPhone 17 Pro simulator found"; exit 1; fi
          echo "Booting iPhone 17 Pro simulator $UDID"
          echo "ONCE_IOS_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
      - run: npm run test:mobile:e2e:ios
      - name: Archive simulator app
        run: ditto -c -k --sequesterRsrc --keepParent "apps/mobile/ios/build/Build/Products/Debug-iphonesimulator/Once Dev.app" apps/mobile/ios/once-dev-simulator.zip
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobile-ios-${{ github.run_id }}
          path: |
            apps/mobile/ios/once-dev-simulator.zip
            test-results/mobile
          if-no-files-found: warn
