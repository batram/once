name: Mobile compatibility

# Compatibility runners are intentionally opt-in.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-api-24:
    name: Android API 24
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run mobile -- package android --channel dev --e2e
      - name: Android native lint and unit tests
        working-directory: apps/mobile/android
        run: java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain lintDevelopmentDebug testDevelopmentDebugUnitTest --no-daemon
      - run: npm exec --workspace @once/mobile -- appium driver install uiautomator2@8.1.0
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          arch: x86_64
          profile: pixel_2
          script: npm run test:mobile:e2e:android
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-api-24-failure-${{ github.run_id }}
          path: test-results/mobile
          if-no-files-found: ignore

  oldest-hosted-ios:
    name: Oldest hosted iOS simulator (15+)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Select oldest installed iOS 15+ simulator
        run: node apps/mobile/scripts/select-ios-simulator.js >> "$GITHUB_ENV"
      - run: npm run mobile -- package ios --channel dev --e2e
      - run: npm exec --workspace @once/mobile -- appium driver install xcuitest@11.17.7
      # Warm the WDA DerivedData before the session; see mobile.yml for why.
      - name: Prebuild WebDriverAgent
        run: |
          WDA=$(find node_modules -type d -name appium-webdriveragent | head -1)
          if [ -z "$WDA" ]; then echo "appium-webdriveragent not found under node_modules"; exit 1; fi
          xcodebuild build-for-testing \
            -project "$WDA/WebDriverAgent.xcodeproj" \
            -scheme WebDriverAgentRunner \
            -destination "id=$ONCE_IOS_UDID" \
            IPHONEOS_DEPLOYMENT_TARGET="$ONCE_IOS_VERSION" \
            GCC_TREAT_WARNINGS_AS_ERRORS=0 COMPILER_INDEX_STORE_ENABLE=NO
      - run: npm run test:mobile:e2e:ios
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: oldest-ios-failure-${{ github.run_id }}
          path: test-results/mobile
          if-no-files-found: ignore
