name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect mobile changes
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mobile:
              - 'apps/mobile/**'
              - 'packages/app/**'
              - 'packages/core/**'
              - 'packages/collectors/**'
              - 'packages/persistence/**'
              - 'packages/platform-mobile/**'
              - 'packages/ui-web/**'
              - 'tests/e2e/mobile/**'
              - 'tests/mobile-env/**'
              - 'tests/unit/mobile/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/mobile-compat.yml'
              - 'package*.json'

  quality:
    name: Linting, types, build, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run test:collectors

  extensions:
    name: Chrome and Firefox extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:extensions
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: extension-test-results
          path: test-results
          if-no-files-found: ignore

  electron:
    name: Packaged Electron on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:electron
      - run: npm run test:electron:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: electron-test-results
          path: test-results
          if-no-files-found: ignore

  mobile-android:
    name: Capacitor Android
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run test:mobile
      - run: npm run test:mobile:web
      - run: npm run mobile -- package android --channel dev --e2e
      - name: Android native lint and unit tests
        working-directory: apps/mobile/android
        run: java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain lintDevelopmentDebug testDevelopmentDebugUnitTest --no-daemon
      - run: npm exec --workspace @once/mobile -- appium driver install uiautomator2@8.1.0
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          script: npm run test:mobile:e2e:android
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobile-android-${{ github.run_id }}
          path: |
            apps/mobile/android/app/build/outputs/apk/development/debug/*.apk
            apps/mobile/android/app/build/reports
            test-results/mobile
          if-no-files-found: warn

  mobile-ios:
    name: Capacitor iOS
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run mobile -- package ios --channel dev --e2e
      - run: npm exec --workspace @once/mobile -- appium driver install xcuitest@11.17.7
      - run: npm run test:mobile:e2e:ios
      - name: Archive simulator app
        run: ditto -c -k --sequesterRsrc --keepParent "apps/mobile/ios/build/Build/Products/Debug-iphonesimulator/Once Dev.app" apps/mobile/ios/once-dev-simulator.zip
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobile-ios-${{ github.run_id }}
          path: |
            apps/mobile/ios/once-dev-simulator.zip
            test-results/mobile
          if-no-files-found: warn
