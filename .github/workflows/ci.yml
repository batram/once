name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Linting, types, build, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run test:collectors

  extensions:
    name: Chrome and Firefox extensions
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:setup:ci
      - run: npm run test:extensions
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: extension-test-results
          path: test-results
          if-no-files-found: ignore

  electron:
    name: Packaged Electron on Windows
    runs-on: windows-latest
    # The e2e suite runs about ten minutes on a hosted runner after a
    # four-minute package; a job past this budget is hung, not slow, and
    # the default six hours would hide that behind a cancelled run.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:electron
      - run: npm run test:design-system
      - run: npm run test:electron:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: electron-test-results
          path: test-results
          if-no-files-found: ignore
