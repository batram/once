name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Linting, types, build, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit

  extensions:
    name: Chrome and Firefox extensions
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:setup:ci
      - run: npm run test:extensions
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: extension-test-results
          path: test-results
          if-no-files-found: ignore

  electron-contracts:
    name: Windows integration and design system
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:electron
      - run: npm run test:design-system
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: windows-contract-test-results
          path: test-results
          if-no-files-found: ignore

  electron-e2e:
    name: Electron E2E (${{ matrix.shard }}/6)
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            rendering: none
          - shard: 2
            rendering: none
          - shard: 3
            rendering: "0"
          - shard: 4
            rendering: none
          - shard: 5
            rendering: "1"
          - shard: 6
            rendering: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Every shard retains a private Windows desktop and one Playwright worker.
      # Building independently avoids a serial build/artifact-transfer barrier.
      - run: npm run test:electron:e2e -- --shard=${{ matrix.shard }}/6
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: electron-e2e-timings-${{ matrix.shard }}
          path: artifacts/electron-e2e/results.json
          retention-days: 14
          if-no-files-found: error
      # The shorter shards reuse their build for one complete calibration pair.
      # Pairs stay on separate desktops and never overlap Playwright execution.
      - run: npm run test:electron:rendering:run
        if: ${{ !cancelled() && matrix.rendering != 'none' }}
        env:
          ONCE_RENDERING_ITERATION: ${{ matrix.rendering }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && matrix.rendering != 'none' }}
        with:
          name: native-rendering-${{ matrix.rendering }}
          path: artifacts/native-rendering
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: electron-e2e-failures-${{ matrix.shard }}
          path: test-results
          if-no-files-found: ignore

  # Preserve the existing required-check name, and reject failed/skipped jobs.
  electron:
    name: Packaged Electron on Windows
    if: ${{ always() }}
    needs: [electron-contracts, electron-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Windows check
        env:
          CONTRACTS: ${{ needs.electron-contracts.result }}
          E2E: ${{ needs.electron-e2e.result }}
        run: |
          test "$CONTRACTS" = success
          test "$E2E" = success
