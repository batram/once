<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>once</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' http: https:; frame-src 'self' blob:;"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body animated="true">
    <div id="window_content">
      <div id="left_panel">
        <div id="titlebar">
          <img id="titlebar-logo" src="imgs/icons/icon.svg" alt="Once" />
          <span id="titlebar-text">once</span>
        </div>
        <div id="left_panel_content">
          <div id="menu">
            <div
              class="sub"
              id="settings_menu_btn"
              data-panel="settings"
              data-testid="settings-menu"
            >
              <div class="heading">
                <img src="imgs/gear.svg" title="Settings" />
                <p>Settings</p>
              </div>
            </div>
            <div
              class="sub"
              id="reading_menu_btn"
              data-panel="reading"
              data-testid="reading-menu"
            >
              <div class="heading">
                <img src="imgs/article.svg" title="Reading" />
                <p>Reading</p>
              </div>
            </div>
            <div
              class="sub"
              id="stories_menu_btn"
              data-panel="stories"
              data-testid="stories-menu"
            >
              <div class="heading">
                <img src="imgs/story.svg" title="Stories" />
                <p>Stories</p>
              </div>
              <div id="types"></div>
              <div id="groups"></div>
            </div>
          </div>
          <div id="left_main">
            <div id="stories_panel" class="panel" data-panel="stories">
              <div id="search_bar" class="bar">
                <div class="btn bar_btn collapsebutton" title="collapse">
                  &lt;
                </div>
                <select id="search_scope">
                  <option>local</option>
                  <option>global</option>
                </select>
                <input type="text" id="searchfield" placeholder="search" />
                <div
                  id="cancel_search_btn"
                  class="bar_btn btn"
                  title="cancel search"
                >
                  <img src="imgs/x.svg" />
                </div>
                <div
                  id="reload_stories_btn"
                  data-testid="reload-stories"
                  class="btn bar_btn"
                  title="reload stories"
                >
                  <img src="imgs/reload.svg" />
                </div>
              </div>
              <div id="mobile_filter_chips" aria-label="Story filters"></div>
              <div class="stories_container" id="selected_container"></div>
              <div
                class="stories_container"
                id="stories"
                data-testid="stories"
              ></div>
              <div class="stories_container" id="global_search_results"></div>
              <div class="stories_container" id="filtered_stories"></div>
            </div>
            <div id="settings_panel" class="panel" data-panel="settings">
              <div class="bar">
                <div class="btn bar_btn collapsebutton" title="collapse">
                  &lt;
                </div>
                <div class="settings_title">Settings</div>
                <button type="button" id="settings_section_back" hidden>‹ Settings</button>
              </div>
              <div class="settings_container">
                <div id="settings_index">
                  <input
                    type="search"
                    id="settings_search"
                    placeholder="Search settings"
                    aria-label="Search settings"
                  />
                  <nav id="settings_sections" aria-label="Settings sections"></nav>
                </div>
                <div class="settings_block">
                  Story sources:
                  <div class="input_container">
                    <div class="backdrop"></div>
                    <textarea
                      id="sources_area"
                      spellcheck="false"
                      data-testid="sources"
                    ></textarea>
                    <div class="highlights"></div>
                  </div>
                  <input
                    type="button"
                    value="save"
                    data-testid="save-sources"
                  />
                  <input type="button" value="cancel" />
                  <input
                    type="button"
                    id="pick_source_button"
                    value="pick from page"
                    title="Build a source by picking story elements on the current page"
                    data-testid="pick-source"
                  />
                  <span id="pick_source_status" role="status"></span>
                </div>
                <div class="settings_block">
                  Filters:
                  <div class="input_container">
                    <textarea
                      id="filter_area"
                      spellcheck="false"
                      data-testid="filters"
                    ></textarea>
                  </div>
                  <input
                    type="button"
                    value="save"
                    data-testid="save-filters"
                  />
                  <input type="button" value="cancel" />
                </div>
                <div class="settings_block">
                  Redirects:
                  <div class="input_container">
                    <textarea
                      id="redirect_area"
                      spellcheck="false"
                      data-testid="redirects"
                    ></textarea>
                  </div>
                  <input
                    type="button"
                    value="save"
                    data-testid="save-redirects"
                  />
                  <input type="button" value="cancel" />
                </div>
                <div class="settings_block">
                  CouchDB Sync:
                  <div class="couch-container masked">
                    <div class="couch-highlights"></div>
                    <input
                      id="couch_input"
                      data-testid="sync-url"
                      type="text"
                      spellcheck="false"
                      placeholder="https://cred:entials@couchdb.example.org/once"
                    />
                    <button
                      id="couch_toggle"
                      class="icon-btn"
                      title="Toggle password visibility"
                    >
                      👁️
                    </button>
                  </div>
                  <input type="button" value="save" data-testid="save-sync" />
                  <input type="button" value="cancel" />
                  <div
                    id="couch_status"
                    class="couch-status"
                    data-state="disabled"
                    data-testid="sync-status"
                    role="status"
                    aria-live="polite"
                  >
                    Sync is not configured
                  </div>
                </div>
                <div class="settings_block">
                  Theme:
                  <select id="theme_select" data-testid="theme">
                    <option value="dark">Dark</option>
                    <option value="light">Light</option>
                    <option value="system">System</option>
                    <option value="custom">TODO: Custom</option>
                  </select>
                  <p>
                    <input type="checkbox" id="anim_checkbox" />
                    <label for="anim_checkbox">Animations</label>
                  </p>
                </div>
                <div class="settings_block settings_swipe">
                  Swipe actions:
                  <p>
                    <input type="checkbox" id="swipe_two_stage" />
                    <label for="swipe_two_stage">Two-stage swipe</label>
                  </p>
                  <!-- rows are generated by SettingsPanel from the stored
                       settings, so the count stays tied to the model -->
                  <div id="swipe_stages" data-testid="swipe-stages"></div>
                  <!-- sample row, built by SettingsPanel; it swipes with the
                       values currently in the form and commits nothing -->
                  <div id="swipe_preview" data-testid="swipe-preview"></div>
                  <input type="button" value="save" data-testid="save-swipe" />
                  <input type="button" value="cancel" />
                  <input
                    type="button"
                    value="reset to defaults"
                    id="swipe_reset"
                    data-testid="reset-swipe"
                  />
                </div>
                <div class="settings_block">
                  Cache timing (minutes):
                  <input type="text" id="cache_time_input" />
                  <input type="button" value="save" id="cache_time_save" />
                  <input type="button" value="cancel" id="cache_time_cancel" />
                </div>
                <div class="settings_block settings_error_log">
                  <div class="settings_error_log_header">
                    <span>Error log:</span>
                    <button type="button" id="clear_error_log">Clear</button>
                  </div>
                  <div id="error_log" data-testid="error-log">
                    <p class="error_log_empty">No errors recorded this session.</p>
                  </div>
                </div>
                <div class="settings_block settings_version">
                  <span>Version: <span data-testid="app-version"></span></span>
                  <input
                    type="button"
                    data-testid="check-for-updates"
                    value="Check for updates"
                    hidden
                  />
                  <span
                    class="update_status"
                    data-testid="update-status"
                    role="status"
                    aria-live="polite"
                  ></span>
                </div>
              </div>
            </div>
            <div id="reading_panel" class="panel" data-panel="reading">
              <form id="reading_url_form" data-testid="reading-url-form" novalidate>
                <div id="reading_url_group">
                  <input id="reading_url" data-testid="reading-url-input" type="url"
                    inputmode="url" enterkeyhint="go" autocomplete="url"
                    autocapitalize="none" spellcheck="false" aria-label="Address" />
                  <button type="button" id="reading_reader_toggle" aria-label="Toggle reader mode">
                    <img src="imgs/article.svg" alt="" />
                  </button>
                </div>
                <button type="submit" id="reading_navigate" data-testid="reading-url-action"
                  aria-label="Reload">↻</button>
              </form>
              <div id="reading_url_validation" data-testid="reading-url-validation"
                role="status" aria-live="polite" hidden></div>
              <section id="reading_current_card" class="story" data-testid="reading-current-card"
                aria-label="Current page">
                <div class="data">
                  <div class="title_line">
                    <a id="reading_title" class="title" href="">Reading</a>
                  </div>
                  <div class="substories">
                    <div id="reading_story_meta" class="info">
                      <p id="reading_type" class="type"></p>
                      <button type="button" id="reading_comments" class="comment_url">[comments]</button>
                      <div id="reading_story_time" class="time"></div>
                      <div id="reading_story_tags" class="tags_container"></div>
                    </div>
                  </div>
                </div>
                <button type="button" id="reading_story_menu" class="menu_btn"
                  aria-label="Story actions">⋮</button>
              </section>
              <div id="reading_error" role="status" aria-live="polite" hidden></div>
              <div id="reading_content" aria-label="Reading content"></div>
              <button type="button" id="reading_tts_start" data-testid="reading-tts-start"
                aria-label="Read aloud" hidden>▶ <span>Read aloud</span></button>
              <div id="reader_tts_pill" role="group" aria-label="Text to speech" hidden>
                <button type="button" data-host-tts="prev" aria-label="Previous segment">‹</button>
                <button type="button" data-host-tts="play" aria-label="Play article">▶</button>
                <button type="button" data-host-tts="next" aria-label="Next segment">›</button>
                <details id="reader_tts_settings">
                  <summary><span id="reader_tts_rate_label">1.0×</span></summary>
                  <label>
                    Voice
                    <select id="reader_tts_voice"><option value="">Default voice</option></select>
                  </label>
                  <div id="reader_tts_rates" aria-label="Speech rate"></div>
                </details>
                <button type="button" data-host-tts="close" aria-label="Dismiss speech controls">×</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
